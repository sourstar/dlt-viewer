# Windows builds for this performance fork, MSVC only.
#
# This branch (perf/integration) stays MSVC + Qt 6.8.3, matching upstream's own
# release configuration, so the work here can be backported cleanly. The
# mingw-w64 toolchain, the latest Qt and the reproducible build container live
# on the perf/mingw branch instead.
#
# Windows ARM64 needs the MSVC ARM64 toolchain and an ARM64 Qt build, so it is
# built natively on GitHub's windows-11-arm runner, exactly the way upstream
# does.
#
# Run it from the Actions tab (Run workflow), or let it run on a push.
name: Build Windows (fork)

on:
  workflow_dispatch:
  push:
    branches:
      - 'perf/**'
    tags:
      - "*"

jobs:
  buildWindows_x64:
    name: Build Windows x86_64 (MSVC)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Install qt
        uses: jurplel/install-qt-action@v4
        with:
          modules: qtserialport
      - name: Build with CMake
        run: >
          $env:WORKSPACE=$env:GITHUB_WORKSPACE;
          $env:CPACK_7Z="true";
          $env:CPACK_NSIS="true";
          ./build_sdk_windows_qt6_MSVC_cmake.bat
      - name: Archive artifact
        uses: actions/upload-artifact@v7
        if: ${{ success() }}
        with:
          name: DLTViewer-perf-windows-x86_64
          path: |
            build/dist/DLTViewer*.7z
            build/dist/DLTViewer*.exe

  buildWindows_arm64:
    name: Build Windows ARM64 (MSVC)
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Install qt
        uses: jurplel/install-qt-action@v4
        with:
          modules: qtserialport
      - name: Build with CMake
        run: >
          $env:WORKSPACE=$env:GITHUB_WORKSPACE;
          $env:CPACK_7Z="true";
          $env:CPACK_NSIS="true";
          ./build_sdk_windows_arm_qt6_MSVC_cmake.bat
      - name: Archive artifact
        uses: actions/upload-artifact@v7
        if: ${{ success() }}
        with:
          name: DLTViewer-perf-windows-arm64
          path: |
            build/dist/DLTViewer*.7z
            build/dist/DLTViewer*.exe

